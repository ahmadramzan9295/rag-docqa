version: "3.9"

# =============================================================================
#  RAG DocQA — Docker Compose
#
#  Services:
#    backend  — FastAPI  (port 8000)
#    frontend — Nginx + React build (port 3000)
#
#  Usage:
#    docker compose up --build          # first run
#    docker compose up -d               # subsequent runs (detached)
#    docker compose down -v             # stop and remove volumes
# =============================================================================

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    env_file: .env                      # load your real .env file
    environment:
      - FAISS_INDEX_PATH=/data/faiss_index
      - LOCAL_UPLOAD_DIR=/data/uploads
      - APP_ENV=production
    ports:
      - "8000:8000"                     # expose backend directly (optional)
    volumes:
      - rag_data:/data                  # persist FAISS index + uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - rag_network

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                       # app available at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy      # wait until backend is ready
    networks:
      - rag_network


# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  rag_data:
    driver: local


# ── Internal Network ─────────────────────────────────────────────────────────
networks:
  rag_network:
    driver: bridge
