server {
    listen 80;
    server_name _;

    # Serve React static files
    root /usr/share/nginx/html;
    index index.html;

    # --- API Proxy ---
    # All requests to /api/* are forwarded to the FastAPI backend container
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # allow long LLM responses
        proxy_send_timeout 300s;
        client_max_body_size 100M; # allow large file uploads
    }

    # --- React SPA Fallback ---
    # All other routes fall back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Nginx health check endpoint ---
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
