version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: rag-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      - FAISS_INDEX_PATH=/data/faiss_index
      - LOCAL_UPLOAD_DIR=/data/uploads
      - APP_ENV=production
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - rag_network

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"                       # app available at http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy      # wait until backend is ready
    networks:
      - rag_network


# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  rag_data:
    driver: local


# ── Internal Network ─────────────────────────────────────────────────────────
networks:
  rag_network:
    driver: bridge
