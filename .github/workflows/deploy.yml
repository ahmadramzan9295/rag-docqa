name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: rag-docqa
  REGION: us-central1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/rag-docqa

jobs:
  # ── test ────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: development
          SECRET_KEY: test-secret
          ANTHROPIC_API_KEY: sk-test
        run: pytest tests/ -v --tb=short

  # ── build & push ─────────────────────────────────────────────────────────────
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -f docker/Dockerfile -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

  # ── deploy to Cloud Run ───────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy FastAPI to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}-api
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --port=8000
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=5
            --concurrency=10
          env_vars: |
            APP_ENV=production
            LLM_PROVIDER=anthropic
            STORAGE_BACKEND=gcs
          secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:latest
            SECRET_KEY=jwt-secret-key:latest

      - name: Deploy Streamlit to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}-ui
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --port=8501
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=20
          env_vars: |
            APP_ENV=production
          secrets: |
            SECRET_KEY=jwt-secret-key:latest
